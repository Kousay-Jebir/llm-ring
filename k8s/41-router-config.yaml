# Every router setting lives here. The router has no defaults in its code:
# if a key is missing, it refuses to start and names the missing key.
# After a change: kubectl apply -f k8s/41-router-config.yaml; kubectl rollout restart deployment/router
apiVersion: v1
kind: ConfigMap
metadata:
  name: router-config
  namespace: llm-ring
data:
  # Routing policy at startup (switchable at runtime through /admin/policy)
  ROUTER_POLICY: "consistent"
  ROUTER_VNODES: "100"                    # points per replica on the hash ring
  ROUTER_EPSILON: "0.25"                  # bounded loads: cap = (1 + epsilon) x average load
  ROUTER_LOAD_METRIC: "tokens"          # bounded: "requests" or "tokens"
  ROUTER_DEFAULT_MAX_TOKENS: "256"        # answer size assumed when a request doesn't set max_tokens

  # llm-aware additions (each switchable for ablations)
  ROUTER_TOKEN_LOAD: "true"
  ROUTER_LONG_STICKINESS: "true"
  ROUTER_PLACEMENT_MEMORY: "true"
  ROUTER_LONG_EPSILON: "1.0"              # cap for long cached conversations
  ROUTER_LONG_THRESHOLD_TOKENS: "800"     # what counts as long (estimated tokens)
  ROUTER_MEMORY_MAX_ENTRIES: "50000"      # conversations remembered by placement memory

  # Replica discovery (EndpointSlices of the headless Service)
  ROUTER_K8S_NAMESPACE: "llm-ring"
  ROUTER_K8S_SERVICE: "llm"
  ROUTER_K8S_PORT_NAME: "http"
  ROUTER_DISCOVERY_INTERVAL_S: "2"
  ROUTER_K8S_API_TIMEOUT_S: "5"

  # Connections to the replicas
  ROUTER_UPSTREAM_TIMEOUT_S: "600"        # wait for an answer; must exceed the slowest request
  ROUTER_UPSTREAM_CONNECT_TIMEOUT_S: "5"
  ROUTER_UPSTREAM_MAX_CONNECTIONS: "1024"
  ROUTER_UPSTREAM_MAX_KEEPALIVE: "512"

  ROUTER_LOG_LEVEL: "INFO"
