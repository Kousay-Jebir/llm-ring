apiVersion: v1
kind: ConfigMap
metadata:
  name: router-config
  namespace: llm-ring
data:
  ROUTER_POLICY: "consistent"
  ROUTER_DISCOVERY: "kubernetes"
  ROUTER_K8S_NAMESPACE: "llm-ring"
  ROUTER_K8S_SERVICE: "llm"
  ROUTER_DISCOVERY_INTERVAL_S: "2"
  ROUTER_VNODES: "100"
  ROUTER_EPSILON: "0.25"
  ROUTER_LONG_EPSILON: "1.0"
  ROUTER_LONG_THRESHOLD_TOKENS: "800"
  ROUTER_UPSTREAM_TIMEOUT_S: "600"
  ROUTER_LOG_LEVEL: "INFO"
