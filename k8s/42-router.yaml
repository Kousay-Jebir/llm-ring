apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: llm-ring
spec:
  selector: { app: router }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  namespace: llm-ring
spec:
  # A single instance on purpose: load counters and placement memory live in the
  # process. Running several routers is a separate experiment (see docs/design.md).
  replicas: 1
  strategy:
    type: Recreate
  selector: { matchLabels: { app: router } }
  template:
    metadata:
      labels: { app: router }
    spec:
      serviceAccountName: router
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: router
          image: llm-ring-router:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom: [{ configMapRef: { name: router-config } }]
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
